<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1635" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="glowOrb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowOrb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes floatLeftRight {
        0% { transform: translateX(0px) translateY(0px); }
        50% { transform: translateX(25px) translateY(-10px); }
        100% { transform: translateX(0px) translateY(0px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .orb-2 {
        animation: pulseGlow 9s ease-in-out infinite reverse;
        transform-origin: center;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashAnim 12s linear infinite;
      }
      .floating-group {
        animation: floatLeftRight 8s ease-in-out infinite;
      }
      .node-card {
        animation: nodePulse 5s ease-in-out infinite;
      }
      .node-card-2 {
        animation: nodePulse 6s ease-in-out infinite 1s;
      }
      .node-card-3 {
        animation: nodePulse 7s ease-in-out infinite 2s;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Behind everything) -->
  <circle class="orb-1" cx="220" cy="180" r="260" fill="url(#glowOrb1)" />
  <circle class="orb-2" cx="980" cy="240" r="280" fill="url(#glowOrb2)" />

  <!-- Grid overlay -->
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />

  <!-- Dynamic Network / Flow Graphic Elements (Background accents) -->
  <g class="floating-group" opacity="0.6">
    <path class="flow-line" d="M 80,340 C 260,390 480,300 700,350 C 900,400 1060,320 1150,340" fill="none" stroke="#6366f1" stroke-width="2" />
    <path class="flow-line" d="M 50,70 C 250,30 450,110 750,50 C 950,10 1080,90 1160,60" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Dynamic Decorative Nodes on the right side -->
  <g class="node-card" transform="translate(930, 80)">
    <rect width="210" height="64" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.4))" />
    <circle cx="28" cy="32" r="12" fill="#0284c7" />
    <text x="28" y="36" fill="#ffffff" font-size="12" text-anchor="middle" font-family="sans-serif" font-weight="bold">◈</text>
    <text x="52" y="27" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="bold">Multi-Channel PIM</text>
    <text x="52" y="47" fill="#94a3b8" font-size="11" font-family="sans-serif">Real-Time Syndication</text>
  </g>

  <g class="node-card-2" transform="translate(960, 175)">
    <rect width="200" height="64" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.4))" />
    <circle cx="28" cy="32" r="12" fill="#9333ea" />
    <text x="28" y="37" fill="#ffffff" font-size="12" text-anchor="middle" font-family="sans-serif" font-weight="bold">⚡</text>
    <text x="52" y="27" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="bold">Dynamic Catalogs</text>
    <text x="52" y="47" fill="#94a3b8" font-size="11" font-family="sans-serif">Plan &amp; SKU Intelligence</text>
  </g>

  <g class="node-card-3" transform="translate(910, 270)">
    <rect width="220" height="64" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-width="1.2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.4))" />
    <circle cx="28" cy="32" r="12" fill="#059669" />
    <text x="28" y="37" fill="#ffffff" font-size="12" text-anchor="middle" font-family="sans-serif" font-weight="bold">✦</text>
    <text x="52" y="27" fill="#f8fafc" font-size="13" font-family="sans-serif" font-weight="bold">AI-Powered Enrichment</text>
    <text x="52" y="47" fill="#94a3b8" font-size="11" font-family="sans-serif">Automated Attribute Gen</text>
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges/Pills -->
  <!-- Header Pill -->
  <g transform="translate(80, 58)">
    <rect width="270" height="30" rx="15" fill="#312e81" fill-opacity="0.8" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="20" fill="#c7d2fe" class="pill-text">ECOSYSTEM DIRECTORY &amp; ARCHITECTURE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="140" fill="url(#primaryGrad)" class="title-text">
    Dynamic Product &amp; Plan Catalog
  </text>

  <!-- Subtitle -->
  <text x="80" y="185" fill="#e2e8f0" class="subtitle-text">
    Curated List of SaaS Platforms &amp; Open-Source Engines for Modern PIM &amp; PXM
  </text>
  <text x="80" y="215" fill="#94a3b8" font-size="15" font-family="sans-serif">
    Centralize attributes, automate digital shelf syndication, and scale multi-channel commerce catalogs.
  </text>

  <!-- Feature Badges / Highlights -->
  <g transform="translate(80, 265)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="82" y="24" fill="#38bdf8" class="pill-text" text-anchor="middle">📦 PIM / PXM SUITES</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="170" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="265" y="24" fill="#818cf8" class="pill-text" text-anchor="middle">⚡ DYNAMIC PRICING</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="190" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="460" y="24" fill="#c084fc" class="pill-text" text-anchor="middle">🌐 OMNICHANNEL SYNC</text>

    <!-- Pill 4 -->
    <rect x="570" y="0" width="190" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="665" y="24" fill="#34d399" class="pill-text" text-anchor="middle">🚀 OPEN-SOURCE PIM</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="80" y="340" width="760" height="2" fill="url(#primaryGrad)" opacity="0.6" />
  <text x="80" y="375" fill="#64748b" font-size="13" font-family="sans-serif">
    Maintained by Ishan Dutta • Updated for 2026 Ecosystem Benchmarks
  </text>
</svg>
